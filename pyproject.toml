[project]
name = "biological-protocol-reviewer-skill"
version = "1.4.2"
description = "Portable agent skill for evidence-grounded biological protocol review and SOP rewriting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "Felix-owo" }]
keywords = ["agent-skill", "protocol-review", "sop", "biology", "schema-validation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.22",
  "PyYAML>=6.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "-p", "no:ddtrace",
  "-p", "no:metadata",
  "-p", "no:json-report",
  "-p", "no:cov",
  "-p", "no:Faker",
  "-p", "no:anyio",
  "-p", "no:asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
