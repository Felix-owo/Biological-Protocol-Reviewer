interface:
  display_name: "Biological Protocol Reviewer v1.5.0"
  short_description: "Audit biological protocols; rewrite SOPs only on request"
  brand_color: "#0F766E"
  default_prompt: "Use $biological-protocol-reviewer v1.5.0 in the default protocol_gate profile to review this biological protocol, reconstruct the intended result and primary readout, benchmark evidence and parameter authority, run protocol-panel and failure-mode checks, lock the Protocol Readiness Contract, then produce Review_Report.md. Use protocol_full and rewrite Revised_Protocol.md only if I explicitly request it."
policy:
  allow_implicit_invocation: true
