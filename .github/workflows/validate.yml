name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Compile Python scripts
        run: |
          python -m py_compile biological-protocol-reviewer/scripts/*.py
          python -m py_compile tools/*.py
      - name: Validate installable skill package
        run: python biological-protocol-reviewer/scripts/check_installable_skill.py --skill-dir biological-protocol-reviewer
      - name: Validate version consistency
        run: python biological-protocol-reviewer/scripts/check_version_consistency.py
      - name: Run bundled regression fixtures
        run: python biological-protocol-reviewer/scripts/run_regression_fixtures.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate benchmark definitions
        run: python tools/score_protocol_benchmark.py --benchmark-root benchmarks/v1.0
      - name: Validate structured fixture
        run: python biological-protocol-reviewer/scripts/lint_structured_protocol.py tests/fixtures/structured/valid_review_report.json
      - name: Validate Markdown fixture
        run: >
          python biological-protocol-reviewer/scripts/protocol_output_validator.py
          --report tests/fixtures/markdown/valid/Review_Report.md
          --protocol tests/fixtures/markdown/valid/Revised_Protocol.md
