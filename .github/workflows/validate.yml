name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate benchmark definitions
        run: python tools/score_protocol_benchmark.py --benchmark-root benchmarks/v1.0
      - name: Validate structured fixture
        run: python Biological-Protocol-Reviewer/scripts/lint_structured_protocol.py tests/fixtures/structured/valid_review_report.json
      - name: Validate Markdown fixture
        run: >
          python Biological-Protocol-Reviewer/scripts/protocol_output_validator.py
          --report tests/fixtures/markdown/valid/Review_Report.md
          --protocol tests/fixtures/markdown/valid/Revised_Protocol.md
