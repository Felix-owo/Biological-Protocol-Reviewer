name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Validate JSON Schema files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in Path("biological-protocol-reviewer/schemas").glob("*.schema.json"):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print("SCHEMA OK", path)
          PY
      - name: Run Ruff
        run: python -m ruff check .
      - name: Compile Python scripts
        run: |
          python -m py_compile biological-protocol-reviewer/scripts/*.py
          python -m py_compile tools/*.py
      - name: Validate installable skill package
        run: python biological-protocol-reviewer/scripts/check_installable_skill.py --skill-dir biological-protocol-reviewer
      - name: Validate version consistency
        run: python biological-protocol-reviewer/scripts/check_version_consistency.py
      - name: Validate Protocol Passport template
        run: >
          python biological-protocol-reviewer/scripts/check_protocol_passport.py
          biological-protocol-reviewer/templates/protocol_passport_template.yaml
          --allow-template
      - name: Run bundled regression fixtures
        run: python biological-protocol-reviewer/scripts/run_regression_fixtures.py
      - name: Run unit tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - name: Validate benchmark definitions
        run: python tools/score_protocol_benchmark.py --benchmark-root benchmarks/v1.0
      - name: Validate structured fixture
        run: python biological-protocol-reviewer/scripts/lint_structured_protocol.py tests/fixtures/structured/valid_review_report.json
      - name: Validate Markdown fixture
        run: >
          python biological-protocol-reviewer/scripts/protocol_output_validator.py
          --report tests/fixtures/markdown/valid/Review_Report.md
          --protocol tests/fixtures/markdown/valid/Revised_Protocol.md
